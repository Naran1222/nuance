<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubStellar SPHEREx</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h1 class="logo">SubStellar 
            <span class="sub-word">SPHEREx</span>
        </h1>
        <div class="desc">Data Detective — панель керування.</div>
    </div>

    
<div class="viewport">
    <div class="sci-fi-crosshair" id="crosshair">
        <span class="line-top"></span>
        <span class="line-bottom"></span>
        <span class="line-left"></span>
        <span class="line-right"></span>
    </div>
    
    <!-- Панель таймлайну з CSS-орбітою -->
 <div class="orbital-timeline-bar">
  
  <!-- Контейнер, у якому лежать лінія, сонечко та повзунок -->
  <div class="orbit-track-container">
    
    <!-- SVG з пунктирною дугою -->
    <svg class="orbital-svg" viewBox="0 0 1000 100" preserveAspectRatio="none">
      <path id="orbit-path" d="M 20,90 Q 500,0 980,90" fill="transparent" stroke="#FFB300" stroke-width="3" stroke-dasharray="12, 10" />
    </svg>

    <!-- Твоє намальоване сонечко -->
    <div class="sun-orbit-thumb" id="sun-thumb"></div>

    <!-- Невидимий повзунок для керування -->
    <input type="range" min="1" max="100" value="1" class="orbit-range-input" id="orbit-slider">
    
  </div>

  <!-- Підписи дат і лічильник кадрів -->
  <div class="timeline-labels">
    <span>Березень 2025</span>
    <span class="frame-indicator" id="frame-counter">Кадр: 1 / 100</span>
    <span>Вересень 2026</span>
  </div>
  
</div>
</div>


    <script src="script.js" defer></script>
</body>
</html>
